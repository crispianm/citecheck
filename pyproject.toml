[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "citecheck"
version = "0.1.0"
description = "Check a .bib file against an offline DBLP index, with Semantic Scholar/Crossref/OpenAlex fallbacks."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Crispian Morris"}]
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/crispianm/citecheck"
Issues = "https://github.com/crispianm/citecheck/issues"

[project.scripts]
citecheck = "citecheck.cli:main"

[tool.setuptools]
packages = ["citecheck"]
